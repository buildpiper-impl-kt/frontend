name: Frontend Build Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: githubaction
  VALIDATION_FAILURE_ACTION: SUCCEED #or FAILURE SUCCEED
  MAX_ALLOWED_IMAGE_LAYERS: 15

jobs:

  security-scan:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz

          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz

          chmod +x gitleaks

          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect \
          --source . \
          --verbose \
          --redact

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  docker-build-push:
    name: Build Scan Push Docker
    runs-on: ubuntu-latest

    needs: security-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_AAYU_NAME }}
          password: ${{ secrets.DOCKER_AAYU_SECRET }}


      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
          -t ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:latest \
          .

      - name: Validate Docker Image Size
        run: |

          IMAGE_SIZE=$(docker image inspect \
          ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
          --format='{{.Size}}')

          IMAGE_SIZE_MB=$((IMAGE_SIZE / 1024 / 1024))

          echo "Image Size: ${IMAGE_SIZE_MB} MB"

          if [ "$IMAGE_SIZE_MB" -gt 500 ]; then
            echo "WARNING: Docker image size exceeds 500MB"

            if [ "${{ env.VALIDATION_FAILURE_ACTION }}" = "FAILURE" ]; then
              exit 1
            fi
          fi
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: vuln

      - name: Show Docker Layers
        run: |
          LAYERS=$(docker inspect ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} | jq .[].RootFS.Layers | wc -l)
          IMAGE_LAYER=$(expr $LAYERS - 2)
          
          echo "Number of Layers in image are $IMAGE_LAYER"
          echo "Number of Layers are allowed is $MAX_ALLOWED_IMAGE_LAYERS"
          
          if [[ $IMAGE_LAYER -gt $MAX_ALLOWED_IMAGE_LAYERS ]]
          then
             if [[ $VALIDATION_FAILURE_ACTION == "FAILURE" ]]
             then
                  echo "Number of layers are more then expected layers count"
                  echo "build unsucessfull"
                  exit 1
          
             else
                  echo "Number of layers are more then expected layers count please check!!!!!"
             fi
          else
                  echo "Number of layers in docker image is  under expected layers count"
                  logInfoMessage "build sucessfull"
          fi

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

          docker push \
          ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:latest
