name: Frontend Build Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: githubaction
  FAIL_ON_IMAGE_SIZE: false

jobs:

  security-scan:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz

          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz

          chmod +x gitleaks

          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect \
          --source . \
          --verbose \
          --redact

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  docker-build-push:
    name: Build Scan Push Docker
    runs-on: ubuntu-latest

    needs: security-scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_AAYU_NAME }}
          password: ${{ secrets.DOCKER_AAYU_SECRET }}


      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
          -t ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:latest \
          .

      - name: Validate Docker Image Size
        run: |

          IMAGE_SIZE=$(docker image inspect \
          ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
          --format='{{.Size}}')

          IMAGE_SIZE_MB=$((IMAGE_SIZE / 1024 / 1024))

          echo "Image Size: ${IMAGE_SIZE_MB} MB"

          if [ "$IMAGE_SIZE_MB" -gt 500 ]; then
            echo "WARNING: Docker image size exceeds 500MB"

            if [ "${{ env.FAIL_ON_IMAGE_SIZE }}" = "true" ]; then
              exit 1
            fi
          fi
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: vuln

      - name: Show Docker Layers
        run: |
          docker history \
          ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

          docker push \
          ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:latest
