name: Frontend Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: githubaction

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # automaticly generate

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_AAYU_NAME }}
          password: ${{ secrets.DOCKER_AAYU_SECRET }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ env.GITHUB_RUN_NUMBER }} .
          docker tag ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ env.GITHUB_RUN_NUMBER }} \
                     ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Validate Docker Image Size
        run: |
          IMAGE_SIZE=$(docker image inspect \
          ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ env.GITHUB_RUN_NUMBER }} \
          --format='{{.Size}}')

          IMAGE_SIZE_MB=$((IMAGE_SIZE / 1024 / 1024))

          echo "Image Size: ${IMAGE_SIZE_MB} MB"

          if [ "$IMAGE_SIZE_MB" -gt 500 ]; then
            echo "Docker image size exceeds 500MB"
            exit 1
          fi


      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ env.GITHUB_RUN_NUMBER }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'


      - name: Show Docker Layers
        run: docker history ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ env.GITHUB_RUN_NUMBER }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:${{ env.GITHUB_RUN_NUMBER }}
          docker push ${{ secrets.DOCKER_AAYU_NAME }}/${{ env.IMAGE_NAME }}:latest
          
          
